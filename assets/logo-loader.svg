<svg id="quick" class="construct-house-svg" role="img" aria-label="Nouvelle Spaces" xmlns="http://www.w3.org/2000/svg" viewBox="60 170 896 550" width="100%" height="100%" style="width:100%;max-width:min(780px, 86vw);max-height:min(560px, 62vh);height:auto;display:block;overflow:visible;"><style>:root:target *{animation-duration:1.1s!important}.nl-ink { fill:none; stroke:#FAF7F2; stroke-linecap:square; stroke-linejoin:miter; } .nl-house-outline { stroke-dasharray:900; stroke-dashoffset:900; animation:nlDrawHouse 3.8s ease-in-out forwards; } .nl-n-entry { stroke-dasharray:420; stroke-dashoffset:420; animation:nlDrawN 3.8s ease-in-out forwards; } .nl-win { stroke-dasharray:320; stroke-dashoffset:320; animation:nlDrawWin 3.8s ease-in-out forwards; } .nl-door-drop { transform-box:fill-box; transform-origin:center bottom; opacity:0; animation:nlPlaceDoor 3.8s ease-in-out forwards; } .nl-knob-pop { opacity:0; animation:nlKnobPop 3.8s ease-in-out forwards; } .nl-wordmark-reveal { clip-path:inset(0 100% 0 0); animation:nlRevealWord 3.8s ease-in-out forwards; } .nl-tagline-fade { opacity:0; animation:nlTagFade 3.8s ease-in-out forwards; } @keyframes nlDrawHouse { 0%,3%{stroke-dashoffset:900} 28%,100%{stroke-dashoffset:0} } @keyframes nlDrawN { 0%,22%{stroke-dashoffset:420} 48%,100%{stroke-dashoffset:0} } @keyframes nlDrawWin { 0%,44%{stroke-dashoffset:320} 60%,100%{stroke-dashoffset:0} } @keyframes nlPlaceDoor { 0%,46%{opacity:0;transform:translateY(24px) scaleY(.75)} 58%,100%{opacity:1;transform:translateY(0) scaleY(1)} } @keyframes nlKnobPop { 0%,56%{opacity:0} 63%,100%{opacity:1} } @keyframes nlRevealWord { 0%,60%{clip-path:inset(0 100% 0 0)} 82%,100%{clip-path:inset(0 0 0 0)} } @keyframes nlTagFade { 0%,76%{opacity:0} 88%,100%{opacity:1} }</style><g class="nl-ink nl-house-outline" stroke="#FAF7F2" stroke-width="12"><path d="M344 543V338L511 234 672 338V543"/></g><path class="nl-ink nl-n-entry" stroke="#FAF7F2" stroke-width="16" d="M407 543V402H416V438C428 414 447 402 473 402C508 402 526 425 526 460V543"/><path class="nl-win nl-ink" stroke="#FAF7F2" stroke-width="10" d="M588 543V416H631V543"/><path class="nl-door-drop" fill="#C18F58" d="M455 543V452C455 431 465 420 480 420S505 431 505 452V543Z"/><circle class="nl-knob-pop" cx="495" cy="488" r="4.5" fill="#FAF7F2"/><g class="nl-wordmark-reveal" font-family="ambroise-francois-std, Georgia, serif" font-size="64" letter-spacing="-0.01em"><text x="508" y="632" text-anchor="middle"><tspan fill="#FAF7F2">Nouvelle </tspan><tspan fill="#C18F58">Spaces</tspan></text></g><g class="nl-tagline-fade" font-family="sloop-script-three, cursive" font-size="44" fill="#DFD7C8"><text x="508" y="688" text-anchor="middle">Architecture &amp; 3D Visualization</text></g></svg>